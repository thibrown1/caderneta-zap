<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GastosXP">
<title>Entrar no GastosXP</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
:root{--bg:#0A0E1C;--card:#141A2E;--ink:#E8ECF7;--muted:#97A1BC;--soft:#1C2440;--pen:#8EA2FF;--on-pen:#0A0E1C;--cta:#3B57F5;--hero:#1B2DA6;--hero-level:#3150EC;
  --bad:#F27E78;--bad-soft:#3A1719;--good-soft:#12301F;--shadow:0 18px 40px -18px rgba(0,0,0,.8);--f-num:"Unbounded","Avenir Next",system-ui,sans-serif;--f-body:"Onest",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);min-height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100dvh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
[hidden]{display:none!important}
.wrap{width:100%;max-width:400px;display:grid;gap:14px}
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;background:var(--hero);color:#fff;padding:26px 22px 24px;min-height:170px;display:grid;align-content:end;gap:6px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--hero-level);z-index:-1}
.hero img{width:40px;height:40px;position:absolute;top:22px;left:22px;border-radius:11px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
h1{font-family:var(--f-num);font-weight:600;font-size:30px;letter-spacing:-.03em;margin:0;line-height:1.1}
.hero p{margin:0;opacity:.88;font-size:15px}
form{background:var(--card);border-radius:24px;padding:22px 20px;display:grid;gap:16px}
.field{display:grid;gap:8px}
label{font-size:14px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);width:100%;min-height:50px}
input:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--pen)}
button{font:inherit;border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:16px;cursor:pointer;background:var(--cta);color:#fff}
button:focus-visible{outline:2px solid var(--pen);outline-offset:3px}
.msg{font-size:14px;margin:0;padding:11px 13px;border-radius:12px}
.msg.erro{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--good-soft);color:var(--ink)}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <img src="/favicon.svg" alt="">
    <h1>GastosXP</h1>
    <p>Seus gastos da semana e do mês.</p>
  </div>
  <form method="post" action="/login" id="form">
    <p class="msg erro" id="erro" hidden>Usuário ou senha não conferem. Confira e tente de novo.</p>
    <p class="msg ok" id="saiu" hidden>Você saiu da sua conta.</p>
    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <label class="check"><input type="checkbox" name="lembrar" id="lembrar" value="true" checked> Continuar conectado neste aparelho</label>
    <input type="hidden" name="_csrf" id="csrf">
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  document.getElementById('erro').hidden = !p.has('erro');
  document.getElementById('saiu').hidden = !p.has('saiu');
  const token = () => { const m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; };
  const form = document.getElementById('form');
  document.getElementById('csrf').value = token();
  form.addEventListener('submit', () => { document.getElementById('csrf').value = token(); });
})();
</script>
</body>
</html>
